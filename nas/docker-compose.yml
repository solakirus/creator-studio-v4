# Creator Studio v4 web app on nastime (CasaOS: App Store › Custom Install ›
# Import, paste this). Files live in /DATA/AppData/Projects/creator-studio-v4:
#   www/        the web app — update.bat / publish-nas copies it there, and the
#               mirror below keeps it current from GitHub on its own
#   Caddyfile   from this folder (nas/Caddyfile)
#   mirror.js   from this folder (nas/mirror.js)
#
# Caddy serves www/ as before. The mirror gets the whole folder, so it can
# gather a new version in www.next/ and copy it into www/ once it's complete.
name: creator-studio-v4
services:
  creator-studio-v4:
    image: caddy:2-alpine
    container_name: creator-studio-v4
    restart: unless-stopped
    ports:
      - "8795:80"
    environment:
      # Sync Hub, reached from inside the container (the host's port 8787)
      SYNC_HUB: host.docker.internal:8787
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /DATA/AppData/Projects/creator-studio-v4/www:/srv:ro
      - /DATA/AppData/Projects/creator-studio-v4/Caddyfile:/etc/caddy/Caddyfile:ro

  # Looks at GitHub every 5 minutes; a newer version there is copied in.
  # A newer one published from the laptop is never replaced by an older one.
  creator-studio-v4-mirror:
    image: node:20-alpine
    container_name: creator-studio-v4-mirror
    restart: unless-stopped
    working_dir: /site
    command: ["node", "/site/mirror.js"]
    environment:
      SOURCE: https://solakirus.github.io/creator-studio-v4/
      SITE: /site/www
      EVERY: "5"
    volumes:
      - /DATA/AppData/Projects/creator-studio-v4:/site
x-casaos:
  architectures: [amd64, arm64]
  main: creator-studio-v4
  title:
    en_us: Creator Studio v4
  description:
    en_us: Creator Studio v4 for the iPad and any browser, with Sync Hub on the same address. Keeps itself current from GitHub.
  category: Productivity
  port_map: "8795"
  scheme: http
  index: /
